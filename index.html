const BANK=[{"sourceRow":4,"kind":"빈칸채우기","question":"훈민정음에서 자음과 모음 기본자를 창제한 기본 원리는 OO의 원리이다.","explanation":"","type":"short","answers":["상형"],"publicAnswer":"상형"},{"sourceRow":5,"kind":"빈칸채우기","question":"훈민정음의 자음 기본자는 OOOO의 모양을 본떠 만들어졌다.","explanation":"","type":"short","answers":["발음기관"],"publicAnswer":"발음기관"},{"sourceRow":6,"kind":"빈칸채우기","question":"‘ㄱ’에서 OO의 원리로 ㅋ가 창제되었고, 같은 원리로 ㄴ에서 ㄷ, ㅌ이 창제되었다.","explanation":"획을 더하는 원리, ‘가획’이다.","type":"short","answers":["가획"],"publicAnswer":"가획"},{"sourceRow":7,"kind":"O,X","question":"훈민정음 자음자 중에서 ㆁ는 ㅇ에 획을 더하는 방식으로 만들어졌다.","explanation":"ㆁ은 이체자로, 가획의 원리로 만들어지 않았다.","type":"ox","answer":"X"},{"sourceRow":8,"kind":"O,X","question":"훈민정음 자음자 중에서 ㄹ은 ㄴ과 발음 위치가 같으며, ㄴ에 획을 더하는 방식으로 만들어졌다.","explanation":"ㄹ은 이체자로, 가획의 원리로 만들어지지 않았다.","type":"ox","answer":"X"},{"sourceRow":9,"kind":"빈칸채우기","question":"훈민정음 모음 기본자는 OOO의 모양을 본따 만들어졌다.","explanation":"하늘(ㆍ), 땅(ㅡ), 사람(ㅣ)의 모양을 본따 모음 기본자를 만들었다.","type":"short","answers":["천지인"],"publicAnswer":"천지인"},{"sourceRow":10,"kind":"O,X","question":"‘ㅗ’는 초출자이며 양성 모음이고, ‘ㅕ’는 재출자이며 음성 모음이다.","explanation":"","type":"ox","answer":"O"},{"sourceRow":11,"kind":"O,X","question":"현대 국어에서 ㅔ는 단모음이지만, 중세 국어에서 ㅔ는 이중모음이었다.","explanation":"","type":"ox","answer":"O"},{"sourceRow":12,"kind":"O,X","question":"중세 국어에서 ㆍ는 단모음이었으며, 음성 모음이었다","explanation":"아래 아(ㆍ)는 양성 단모음이었다.","type":"ox","answer":"X"},{"sourceRow":13,"kind":"빈칸채우기","question":"입술을 가볍게 떠는 소리를 나타냈던 ㅸ은 ‘OOO 비읍’이라고 한다.","explanation":"","type":"short","answers":["순경음"],"publicAnswer":"순경음"},{"sourceRow":14,"kind":"O,X","question":"훈민정음에서 ‘ㅃ’은 같은 음운 두 개를 나란히 쓴 것으로, ‘합용 병서’ 표기에 해당한다.","explanation":"같은 것을 두 개 나란히 쓴 것은 ‘각자 병서’라고 한다.","type":"ox","answer":"X"},{"sourceRow":15,"kind":"빈칸채우기","question":"중세 국어에서, ㅅ계열 합용 병서인 ‘ㅼ’은 ㅅ 뒤에 ㄷ이 바로 이어 발음되는 방식으로 나타났다.","explanation":"된소리로 발음되었다.","type":"ox","answer":"X"},{"sourceRow":16,"kind":"빈칸채우기","question":"‘벼+ᄡᅵ’가 현재 ‘볍씨’로 나타나는 것은, ㅂ계열의 합용병서가 OOOOO으로 발음되었다는 증거가 된다.","explanation":"","type":"short","answers":[ 니르·고·져·호ᇙ·배이·셔·도"},{"sourceRow":37,"kind":"객관식","question":"다음 단어들 뒤에 중세 국어 주격 조사가 위치한다고 할 때, 그 형태가 다르게 와야 하는 것 하나는?","explanation":"나머지는 ‘ㅣ’의 형태로, 1번만 생략형(∅)으로 와야 한다.","type":"single","options":["불휘","나","부텨","공ᄌᆞ"],"answer":"불휘"},{"sourceRow":42,"kind":"객관식","question":"아래 단어 중, 중세 국어 관형격조사를 잘못 사용한 형태를 모두 고르시오.","explanation":"3의 ‘말’은 높이지 않는 유정명사이므로 ‘ᄋᆡ’가 와야 하고, 4의 ‘그력’은 음성모음으로 끝나므로 ‘의’가 왔어야 한다.","type":"multi","options":["수픐 가운데(수풀 가운데)","등자ᇇ 기름(등잔의 기름)","맔 털(말의 털)","그려ᄀᆡ 목(기러기의 목)"],"answers":["맔 털(말의 털)","그려ᄀᆡ 목(기러기의 목)"]},{"sourceRow":47,"kind":"객관식","question":"아래 단어 중, 중세 국어 관형격조사를 잘못 사용한 형태를 모두 고르시오.","explanation":"4번 ‘최구’는 음성모음이므로 뒤에 ‘ᄋᆡ’가 아닌 ‘의’가 와야 한다.","type":"single","options":["아바니ᇝ 곁(아바님의 곁)","부텻 자비(부처의 자비)","아ᄃᆞᄅᆡ 짐(아들의 짐)","崔九ᄋᆡ 집(최구의 집)"],"answer":"崔九ᄋᆡ 집(최구의 집)"},{"sourceRow":52,"kind":"빈칸채우기","question":"중세 국어 조사 ‘하’는 높임의 의미를 더하는 O격조사이다.","explanation":"","type":"short","answers":["호","호격"],"publicAnswer":"호"},{"sourceRow":54,"kind":"객관식","question":"다음 중 ‘ㅎ종성체언’이 드러나지 않는 사례를 고르시오.","explanation":"","type":"single","options":["머·리털·이·며·ᄉᆞᆯ·ᄒᆞᆫ (머리털과 살은)",":몯ᄒᆞᇙ·노·미하·니·라 (못하는 사람이 많다)","뫼콰 ᄀᆞᄅᆞᆷᄲᅮᆫ (산과 강뿐)",":내·히이·러 (내가 이루어져)"],"answer":":몯ᄒᆞᇙ·노·미하·니·라 (못하는 사람이 많다)"},{"sourceRow":59,"kind":"빈칸채우기","question":"‘살+고기’=살코기, ‘머리+가락’=머리카락\n위의 사례들은 중세 국어에 OOOOO이 존재했음을 보여 준다.","explanation":"","ignoreSpaces":true,"type":"short","answers":["ㅎ종성체언"],"publicAnswer":"ㅎ종성체언"},{"sourceRow":61,"kind":"빈칸채우기","question":"중세 국어에서 ‘방석’은 ‘네모난 모양의 깔개’만을 뜻했으나 현재는 모양에 상관없이 깔개를 지칭하는 말이 되었다. 이는 어휘의 변화 양상 중 의미 OO에 해당한다.","explanation":"","type":"short","answers":["확대"],"publicAnswer":"확대"},{"sourceRow":62,"kind":"단답형","question":"중세 국어에서 높낮이를 통해 의미를 구분했던 ‘성조’를 표기에도 반영하는 수단을 OO(이)라고 한다.","explanation":"","type":"short","answers":["방점"],"publicAnswer":"방점"},{"sourceRow":63,"kind":"빈칸채우기","question":"훈민정음의 ‘世·솅宗조ᇰ御·ᅌᅥᆼ製·졩’ 등을 보면, 이상적 한자음을 구현하고 한자음은 초성+중성+조성을 모두 갖춰 쓰려는 경향이 나타난다. 이를 OOOO식 한자음 표기라고 한다.","explanation":"","type":"short","answers":["동국정운"],"publicAnswer":"동국 let qs=[],idx=0,records=[],selected=[],locked=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function show(id){["start","quiz","result","wrong"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden")}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function label(t){return t==="ox"?"O / X":t==="single"?"선택형":t==="multi"?"복수 선택형":"단답형"}
function updateLiveScore(){
  const correct=records.filter(r=>r.correct).length;
  const wrong=records.length-correct;
  $("liveScore").textContent=`정답 ${correct} · 오답 ${wrong}`;
}
function startQuiz(custom=null){
  qs=custom?[...custom]:shuffle(BANK);
  idx=0;records=[];
  updateLiveScore();
  show("quiz");
  render();
}
function render(){
 locked=false;selected=[];const q=qs[idx];
 $("count").textContent=`${idx+1} / ${qs.length}`;$("tag").textContent=label(q.type);$("bar").style.width=`${idx/qs.length*100}%`;
 $("question").textContent=q.question;$("feedback").className="hidden";$("checkBtn").classList.remove("hidden");$("nextBtn").classList.add("hidden");$("area").innerHTML="";
 if(q.type==="short"){const input=document.createElement("input");input.type="text";input.id="textAnswer";input.placeholder="정답을 입력하세요";input.autocomplete="off";input.onkeydown=e=>{if(e.key==="Enter")checkAnswer()};$("area").appendChild(input);return}
 const opts=q.type==="ox"?["O","X"]:q.options;
 opts.forEach((v,n)=>{const b=document.createElement("button");b.className="option";b.innerHTML=`<span class="num">${q.type==="ox"?"":(n+1)+"."}</span><span>${esc(v)}</span>`;
 b.onclick=()=>{if(locked)return;if(q.type==="multi"){if(selected.includes(v)){selected=selected.filter(x=>x!==v);b.classList.remove("selected")}else{selected.push(v);b.classList.add("selected")}}else{selected=[v];[...$("area").children].forEach(x=>x.classList.remove("selected"));b.classList.add("selected")}};$("area").appendChild(b)})
}
function norm(s){return String(s??"").trim().replace(/\s+/g," ")}
function checkAnswer(){
 if(locked)return;const q=qs[idx];let user,correct,correctText;
 if(q.type==="short"){
   user=norm($("textAnswer").value);
   if(!user){alert("답을 입력해 주세요.");return}
   const cmp=s=>q.ignoreSpaces?norm(s).replace(/\s+/g,""):norm(s);
   const ucmp=cmp(user);
   correct=q.answers.some(a=>cmp(a)===ucmp) || (q.containsAny||[]).some(x=>ucmp.includes(cmp(x)));
   correctText=q.publicAnswer||q.answers[0];
 }
 else if(q.type==="multi"){if(!selected.length){alert("보기를 하나 이상 선택해 주세요.");return}user=[...selected];const a=[...q.answers].sort(),b=[...selected].sort();correct=JSON.stringify(a)===JSON.stringify(b);correctText=q.answers.join(", ")}
 else{if(!selected.length){alert("답을 선택해 주세요.");return}user=selected[0];correct=user===q.answer;correctText=q.answer}
 records.push({question:q,user,correct,correctText});
 updateLiveScore();
 locked=true;
 const shownUser=Array.isArray(user)?user.join(", "):user;
 $("feedback").className="feedback "+(correct?"good":"bad");
 $("feedback").innerHTML=correct
   ? `<b>정답입니다.</b>${q.explanation?`\n\n${esc(q.explanation)}`:""}`
   : `<b>틀렸습니다.</b>\n정답: ${esc(correctText)}${q.explanation?`\n\n${esc(q.explanation)}`:""}`;
 $("checkBtn").classList.add("hidden");$("nextBtn").classList.remove("hidden");$("nextBtn").textContent=idx===qs.length-1?"결과 보기":"다음 문제";
}
function nextQuestion(){if(idx<qs.length-1){idx++;render()}else showResult()}
function showResult(){show("result");const c=records.filter(r=>r.correct).length;$("score").textContent=`${c} / ${records.length}`;$("summary").textContent=`정답률 ${Math.round(c/records.length*100)}% · 오답 ${records.length-c}개`}
function showWrong(){show("wrong");const w=records.filter(r=>!r.correct);$("wrongList").innerHTML=w.length?w.map((r,n)=>`<div class="review"><span class="tag">${label(r.question.type)}</span><p><b>${n+1}. ${esc(r.question.question)}</b></p><p>내 답: ${esc(Array.isArray(r.user)?r.user.join(", "):r.user)}</p><p>정답: ${esc(r.correctText)}</p>${r.question.explanation?`<p class="muted">${esc(r.question.explanation)}</p>`:""}</div>`).join(""):"<p>틀린 문제가 없습니다.</p>"}
function retryWrong(){const w=records.filter(r=>!r.correct).map(r=>r.question);if(!w.length){alert("틀린 문제가 없습니다.");return}startQuiz(shuffle(w))}
function home(){show("start")}
</script></body></html>
